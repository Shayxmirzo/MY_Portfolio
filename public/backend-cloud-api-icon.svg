<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="limeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89D467"/>
      <stop offset="55%" stop-color="#A9E878"/>
      <stop offset="100%" stop-color="#C6F499"/>
    </linearGradient>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151B1D"/>
      <stop offset="100%" stop-color="#252C2E"/>
    </linearGradient>
  </defs>

  <!-- Dark circular badge -->
  <circle cx="256" cy="256" r="214" fill="url(#darkGradient)"/>

  <!-- Cloud + server + API/network nodes -->
  <g fill="none" stroke="url(#limeGradient)" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Cloud -->
    <path d="M166 249
             C137 249 115 226 115 198
             C115 170 137 147 165 147
             C177 119 203 100 234 100
             C273 100 306 126 315 162
             C323 158 332 156 342 156
             C373 156 398 181 398 212
             C398 233 386 251 369 262"/>

    <!-- Server -->
    <rect x="184" y="238" width="151" height="111" rx="17"/>
    <path d="M184 293h151"/>

    <!-- Server indicators -->
    <circle cx="210" cy="266" r="6" fill="url(#limeGradient)" stroke="none"/>
    <circle cx="233" cy="266" r="6" fill="url(#limeGradient)" stroke="none"/>
    <circle cx="256" cy="266" r="6" fill="url(#limeGradient)" stroke="none"/>
    <path d="M285 266h25"/>

    <circle cx="210" cy="320" r="6" fill="url(#limeGradient)" stroke="none"/>
    <circle cx="233" cy="320" r="6" fill="url(#limeGradient)" stroke="none"/>
    <circle cx="256" cy="320" r="6" fill="url(#limeGradient)" stroke="none"/>

    <!-- API/network branching -->
    <path d="M259 349v46"/>
    <path d="M259 395l-64 38"/>
    <path d="M259 395l64 38"/>
    <path d="M259 395v47"/>

    <!-- Nodes -->
    <circle cx="195" cy="441" r="13"/>
    <circle cx="323" cy="441" r="13"/>
    <circle cx="259" cy="455" r="13"/>

    <!-- Small cloud/network accents -->
    <circle cx="128" cy="286" r="7" fill="url(#limeGradient)" stroke="none"/>
    <circle cx="386" cy="304" r="7" fill="url(#limeGradient)" stroke="none"/>
    <circle cx="390" cy="127" r="7" fill="url(#limeGradient)" stroke="none"/>
  </g>
</svg>